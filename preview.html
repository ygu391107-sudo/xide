<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>习得 · 原型预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@19/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-[#f5f7fb] text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
      const { useMemo, useState } = React;

      const abilities = [
        {
          id: "learning",
          name: "高效学习",
          progress: 72,
          problem: "把输入转化成稳定能力，而不是短暂熟悉感。",
          books: ["上瘾式学习", "认知天性"],
          islands: [
            ["记忆机制", 12, 3],
            ["主动回忆", 9, 2],
            ["间隔复习", 8, 2],
            ["反馈修正", 6, 2],
            ["应用输出", 11, 4],
            ["学习环境", 5, 1],
          ],
        },
        {
          id: "decision",
          name: "决策判断",
          progress: 54,
          problem: "在复杂选择里看见成本、概率和长期影响。",
          books: ["思考，快与慢", "穷查理宝典"],
          islands: [
            ["机会成本", 7, 2],
            ["偏误识别", 10, 3],
            ["长期后果", 6, 2],
          ],
        },
        {
          id: "writing",
          name: "表达写作",
          progress: 41,
          problem: "用短句讲清观点，让别人立刻知道下一步。",
          books: ["金字塔原理", "风格感觉"],
          islands: [
            ["观点排序", 6, 2],
            ["短句表达", 5, 1],
            ["例子设计", 4, 2],
          ],
        },
        {
          id: "longterm",
          name: "长期主义",
          progress: 36,
          problem: "把今天的小动作放进更长的复利系统。",
          books: ["纳瓦尔宝典", "原则"],
          islands: [
            ["复利系统", 5, 2],
            ["反脆弱", 3, 1],
            ["节奏管理", 4, 2],
          ],
        },
      ];

      const books = [
        {
          title: "上瘾式学习",
          author: "李明",
          color: "from-blue-100 to-sky-200",
          excerpt:
            "真正有效的学习不是重复阅读，而是在遗忘发生前主动取回。每一次困难回忆，都会让知识的提取路径更稳固。",
          contributes: ["高效学习", "记忆管理", "自我训练"],
        },
        {
          title: "认知天性",
          author: "彼得 C. 布朗",
          color: "from-indigo-100 to-blue-200",
          excerpt:
            "测验不是学习后的检查，而是学习本身。低风险测验会暴露空白，也会加深长期记忆。",
          contributes: ["高效学习", "反馈修正", "长期记忆"],
        },
        {
          title: "思考，快与慢",
          author: "丹尼尔·卡尼曼",
          color: "from-slate-100 to-gray-200",
          excerpt: "直觉很快，但它也会在复杂问题里给出过度自信的答案。",
          contributes: ["决策判断", "偏误识别", "概率思维"],
        },
        {
          title: "金字塔原理",
          author: "芭芭拉·明托",
          color: "from-cyan-100 to-blue-100",
          excerpt: "清楚的表达先给结论，再组织理由，让听者减少整理负担。",
          contributes: ["表达写作", "结构表达", "沟通效率"],
        },
      ];

      const points = [
        ["主动回忆比重复阅读更有效", "高效学习", "认知天性"],
        ["白纸法能暴露理解空洞", "高效学习", "上瘾式学习"],
        ["反馈要指出遗漏和误解", "高效学习", "上瘾式学习"],
        ["机会成本是被放弃的最好选项", "决策判断", "思考，快与慢"],
        ["先说结论能降低理解负担", "表达写作", "金字塔原理"],
      ];

      const initialTasks = [
        ["用 100 字解释主动回忆", "发给一个正在备考的朋友。", ["主动回忆", "反馈修正"]],
        ["用机会成本分析今天一个选择", "在工作、学习或消费中选一个真实决定。", ["机会成本"]],
        ["用白纸法学习一篇文章", "读完后合上页面，写下你真正记住的结构。", ["白纸法", "主动回忆"]],
      ];

      const nav = [
        ["home", "首页", "今天练什么"],
        ["map", "能力地图", "我正在形成什么能力"],
        ["library", "书库", "能力来自哪些书"],
        ["field", "应用场", "我把知识用到哪里"],
      ];

      const steps = [
        ["read", "学习中"],
        ["recall", "白纸回忆"],
        ["feedback", "AI 反馈"],
        ["schedule", "复习安排"],
        ["apply", "应用任务"],
      ];

      function App() {
        const [view, setView] = useState("home");
        const [abilityId, setAbilityId] = useState("learning");
        const [book, setBook] = useState(books[0]);
        const [step, setStep] = useState("read");
        const [recall, setRecall] = useState("");
        const [done, setDone] = useState([]);
        const ability = useMemo(
          () => abilities.find((item) => item.id === abilityId) || abilities[0],
          [abilityId],
        );

        const start = (nextBook = books[0]) => {
          setBook(nextBook);
          setStep("read");
          setRecall("");
          setView("session");
        };

        return (
          <main className="min-h-screen">
            <div className="pointer-events-none fixed inset-x-0 top-0 h-80 bg-gradient-to-b from-blue-100/70 via-white/60 to-transparent" />
            <div className="relative mx-auto flex min-h-screen max-w-7xl flex-col px-5 py-5 sm:px-8 lg:px-10">
              <header className="flex items-center justify-between rounded-3xl bg-white/80 px-5 py-4 shadow-sm shadow-slate-200/80 backdrop-blur">
                <button onClick={() => setView("home")} className="flex items-center gap-3 text-left">
                  <span className="grid size-11 place-items-center rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-200">习</span>
                  <span>
                    <span className="block text-lg font-semibold">习得</span>
                    <span className="block text-sm text-slate-500">把书变成能力的 AI 学习教练</span>
                  </span>
                </button>
                <button onClick={() => start()} className="hidden rounded-full bg-blue-600 px-5 py-3 text-sm font-medium text-white shadow-lg shadow-blue-200 sm:block">
                  开始一次训练
                </button>
              </header>

              <div className="grid flex-1 gap-6 py-6 lg:grid-cols-[260px_1fr]">
                <aside className="rounded-3xl bg-white/75 p-3 shadow-sm shadow-slate-200/80 backdrop-blur lg:sticky lg:top-6 lg:h-fit">
                  <nav className="grid gap-2">
                    {nav.map(([id, label, sub]) => (
                      <button
                        key={id}
                        onClick={() => setView(id)}
                        className={`rounded-2xl px-4 py-3 text-left transition ${
                          view === id ? "bg-blue-600 text-white shadow-lg shadow-blue-100" : "text-slate-600 hover:bg-slate-100"
                        }`}
                      >
                        <span className="block text-sm font-semibold">{label}</span>
                        <span className={`block text-xs ${view === id ? "text-blue-100" : "text-slate-400"}`}>{sub}</span>
                      </button>
                    ))}
                  </nav>
                </aside>

                <section className="min-w-0">
                  {view === "home" && <Home start={start} setView={setView} done={done} setDone={setDone} />}
                  {view === "map" && <MapView ability={ability} abilityId={abilityId} setAbilityId={setAbilityId} />}
                  {view === "library" && <Library start={start} />}
                  {view === "field" && <Field done={done} setDone={setDone} />}
                  {view === "session" && (
                    <Session book={book} step={step} setStep={setStep} recall={recall} setRecall={setRecall} setView={setView} />
                  )}
                </section>
              </div>
            </div>
          </main>
        );
      }

      function Title({ eyebrow, title, desc }) {
        return (
          <section className="rounded-[2rem] bg-white/80 p-6 shadow-sm shadow-slate-200/90 backdrop-blur sm:p-8">
            <p className="text-sm font-medium text-blue-600">{eyebrow}</p>
            <h1 className="mt-3 max-w-4xl text-3xl font-semibold tracking-tight sm:text-4xl">{title}</h1>
            <p className="mt-4 max-w-2xl text-base leading-7 text-slate-500">{desc}</p>
          </section>
        );
      }

      function Panel({ title, action, onAction, children }) {
        return (
          <section className="rounded-[2rem] bg-white p-5 shadow-sm shadow-slate-200/90 sm:p-6">
            <div className="mb-5 flex items-center justify-between">
              <h2 className="text-lg font-semibold">{title}</h2>
              {action && <button onClick={onAction} className="rounded-full bg-slate-100 px-4 py-2 text-sm font-medium">{action}</button>}
            </div>
            {children}
          </section>
        );
      }

      function Home({ start, setView, done, setDone }) {
        const today = initialTasks.find((_, index) => !done.includes(index)) || initialTasks[0];
        const todayIndex = initialTasks.indexOf(today);
        return (
          <div className="space-y-6">
            <section className="rounded-[2rem] bg-white px-6 py-8 shadow-sm shadow-slate-200/90 sm:px-8">
              <p className="text-sm font-medium text-blue-600">今天练什么</p>
              <h1 className="mt-3 max-w-3xl text-4xl font-semibold tracking-tight sm:text-5xl">今天，把 3 个知识变成你的能力。</h1>
              <p className="mt-4 max-w-3xl text-lg leading-8 text-slate-500">系统已经排好训练顺序。你只需要读一点、合上书、说出你记住了什么。</p>
              <div className="mt-8 flex flex-col gap-3 sm:flex-row">
                <button onClick={() => start()} className="rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-200">开始 12 分钟训练</button>
                <button onClick={() => setView("map")} className="rounded-full bg-slate-100 px-6 py-3 text-sm font-semibold text-slate-700">查看能力地图</button>
              </div>
            </section>

            <div className="grid gap-6 xl:grid-cols-[1.2fr_0.9fr]">
              <Panel title="今日提取" action="进入训练" onAction={() => start()}>
                <div className="grid gap-3">
                  {points.map(([title, ability, source]) => (
                    <div key={title} className="flex items-center justify-between rounded-2xl bg-slate-50 px-4 py-3">
                      <div>
                        <p className="text-sm font-semibold">{title}</p>
                        <p className="mt-1 text-xs text-slate-500">{ability} · {source}</p>
                      </div>
                      <span className="rounded-full bg-white px-3 py-1 text-xs font-medium text-blue-600 shadow-sm">今天</span>
                    </div>
                  ))}
                </div>
              </Panel>
              <Panel title="能力进度" action="看全部" onAction={() => setView("map")}>
                <div className="space-y-5">
                  {abilities.slice(0, 3).map((item) => (
                    <div key={item.id}>
                      <div className="mb-2 flex items-center justify-between">
                        <p className="text-sm font-semibold">{item.name}</p>
                        <span className="text-sm font-semibold text-blue-600">{item.progress}%</span>
                      </div>
                      <div className="h-2 rounded-full bg-slate-100"><div className="h-2 rounded-full bg-blue-600" style={{ width: `${item.progress}%` }} /></div>
                    </div>
                  ))}
                </div>
              </Panel>
            </div>
            <Panel title="今日应用" action={done.includes(todayIndex) ? "已完成" : "标记完成"} onAction={() => setDone(done.includes(todayIndex) ? done.filter((id) => id !== todayIndex) : [...done, todayIndex])}>
              <div className="rounded-3xl bg-gradient-to-br from-blue-50 to-white p-5">
                <p className="text-xl font-semibold">{today[0]}</p>
                <p className="mt-2 text-sm text-slate-500">{today[1]}</p>
              </div>
            </Panel>
          </div>
        );
      }

      function MapView({ ability, abilityId, setAbilityId }) {
        return (
          <div className="space-y-6">
            <Title eyebrow="能力地图" title="你正在形成的，不是笔记，是能力。" desc="书和知识点被系统收进后台，前台只保留能力、训练和下一步。" />
            <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
              {abilities.map((item) => (
                <button key={item.id} onClick={() => setAbilityId(item.id)} className={`rounded-[1.5rem] p-5 text-left shadow-sm transition ${abilityId === item.id ? "bg-blue-600 text-white shadow-blue-200" : "bg-white shadow-slate-200/90"}`}>
                  <div className="mb-8 flex justify-between"><span className="rounded-2xl bg-white/15 px-3 py-2">能力</span><span>{item.progress}%</span></div>
                  <h3 className="text-lg font-semibold">{item.name}</h3>
                  <p className={`mt-2 text-sm leading-6 ${abilityId === item.id ? "text-blue-50" : "text-slate-500"}`}>{item.problem}</p>
                </button>
              ))}
            </div>
            <section className="rounded-[2rem] bg-white p-6 shadow-sm shadow-slate-200/90">
              <p className="text-sm font-medium text-blue-600">主题岛屿</p>
              <h2 className="mt-2 text-3xl font-semibold">{ability.name}</h2>
              <p className="mt-3 text-sm text-slate-500">来源：{ability.books.join("、")}</p>
              <div className="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                {ability.islands.map(([name, pointCount, bookCount]) => (
                  <article key={name} className="rounded-3xl border border-slate-100 bg-gradient-to-br from-white to-slate-50 p-5">
                    <h3 className="text-lg font-semibold">{name}</h3>
                    <p className="mt-2 text-sm text-slate-500">{pointCount} 个知识点 · {bookCount} 本书</p>
                  </article>
                ))}
              </div>
            </section>
          </div>
        );
      }

      function Library({ start }) {
        return (
          <div className="space-y-6">
            <Title eyebrow="书库" title="书不在前台堆积，它们在后台贡献能力。" desc="这里不追踪页数。每本书都被转化为能力模块、复习任务和应用场景。" />
            <div className="grid gap-5 md:grid-cols-2">
              {books.map((book) => (
                <article key={book.title} className="flex flex-col gap-5 rounded-[2rem] bg-white p-5 shadow-sm shadow-slate-200/90 sm:flex-row">
                  <div className={`h-40 rounded-3xl bg-gradient-to-br ${book.color} p-5 sm:w-36`}><p className="mt-20 text-lg font-semibold">{book.title}</p></div>
                  <div>
                    <p className="text-sm text-slate-500">{book.author}</p>
                    <h2 className="mt-1 text-xl font-semibold">{book.title}</h2>
                    <p className="mt-3 text-sm leading-6 text-slate-500">贡献：{book.contributes.join("、")}</p>
                    <button onClick={() => start(book)} className="mt-6 rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-200">从这本书训练</button>
                  </div>
                </article>
              ))}
            </div>
          </div>
        );
      }

      function Field({ done, setDone }) {
        return (
          <div className="space-y-6">
            <Title eyebrow="应用场" title="知识只有被用过，才开始变成能力。" desc="每个任务都很小，但必须进入真实场景。" />
            <div className="grid gap-4">
              {initialTasks.map((task, index) => (
                <article key={task[0]} className="flex flex-col justify-between gap-5 rounded-[2rem] bg-white p-5 shadow-sm shadow-slate-200/90 sm:flex-row sm:items-center">
                  <div>
                    <h2 className="text-lg font-semibold">{task[0]}</h2>
                    <p className="mt-2 text-sm text-slate-500">{task[1]}</p>
                    <div className="mt-3 flex gap-2">{task[2].map((point) => <span key={point} className="rounded-full bg-slate-100 px-3 py-1 text-xs text-slate-600">{point}</span>)}</div>
                  </div>
                  <button onClick={() => setDone(done.includes(index) ? done.filter((id) => id !== index) : [...done, index])} className={`rounded-full px-5 py-3 text-sm font-semibold ${done.includes(index) ? "bg-slate-100 text-slate-500" : "bg-blue-600 text-white shadow-lg shadow-blue-200"}`}>
                    {done.includes(index) ? "撤销完成" : "完成"}
                  </button>
                </article>
              ))}
            </div>
          </div>
        );
      }

      function Session({ book, step, setStep, recall, setRecall, setView }) {
        const active = steps.findIndex(([id]) => id === step);
        return (
          <div className="space-y-6">
            <Title eyebrow="学习流程" title={`${book.title}：读一点，然后合上书。`} desc="这个流程演示核心闭环：阅读、白纸回忆、反馈、复习、应用。" />
            <section className="rounded-[2rem] bg-white p-5 shadow-sm shadow-slate-200/90">
              <div className="grid gap-3 md:grid-cols-5">
                {steps.map(([id, label], index) => (
                  <button key={id} onClick={() => setStep(id)} className={`rounded-2xl px-3 py-3 text-sm font-semibold ${id === step ? "bg-blue-600 text-white" : index < active ? "bg-blue-50 text-blue-600" : "bg-slate-50 text-slate-400"}`}>{label}</button>
                ))}
              </div>
            </section>
            <section className="rounded-[2rem] bg-white p-6 shadow-sm shadow-slate-200/90">
              {step === "read" && <div className="grid gap-6 lg:grid-cols-[0.9fr_1.1fr]"><div className={`rounded-3xl bg-gradient-to-br ${book.color} p-6`}><div className="flex min-h-72 flex-col justify-between"><p className="text-sm text-slate-600">{book.author}</p><h2 className="text-3xl font-semibold">{book.title}</h2></div></div><div><p className="mb-4 inline-block rounded-full bg-blue-50 px-4 py-2 text-sm text-blue-600">阅读 03:00</p><p className="text-2xl font-semibold leading-10">{book.excerpt}</p><button onClick={() => setStep("recall")} className="mt-8 rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white">合上书，开始回忆</button></div></div>}
              {step === "recall" && <div><p className="text-sm font-medium text-blue-600">白纸回忆</p><h2 className="mt-2 text-3xl font-semibold">不看原文，写下你记住的。</h2><textarea value={recall} onChange={(event) => setRecall(event.target.value)} className="mt-6 min-h-72 w-full resize-none rounded-3xl border border-slate-200 bg-slate-50 p-5 outline-none focus:ring-4 focus:ring-blue-100" placeholder="用自己的话写出理解..." /><button onClick={() => setStep("feedback")} className="mt-5 rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white">提交给 AI 反馈</button></div>}
              {step === "feedback" && <StepCard title="你记住了主干，还差两个钩子。" button="安排复习" onClick={() => setStep("schedule")} items={["记住了：主动回忆强于重复阅读", "漏掉了：测验本身也是学习", "误解了：不是越痛苦越好，而是难度要可承受"]} />}
              {step === "schedule" && <StepCard title="这个知识点会在遗忘前回来。" button="生成应用任务" onClick={() => setStep("apply")} items={["明天：白纸回忆", "3 天后：低风险测验", "1 周后：应用输出"]} />}
              {step === "apply" && <StepCard title="用 100 字向朋友解释主动回忆。" button="进入应用场" onClick={() => setView("field")} items={["场景：发给一个正在准备考试的朋友", "目标：帮他把看懂了变成能想起来"]} />}
            </section>
          </div>
        );
      }

      function StepCard({ title, items, button, onClick }) {
        return <div><h2 className="text-3xl font-semibold">{title}</h2><div className="mt-6 grid gap-4 md:grid-cols-3">{items.map((item) => <div key={item} className="rounded-3xl bg-slate-50 p-5 text-sm leading-6 text-slate-600">{item}</div>)}</div><button onClick={onClick} className="mt-6 rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white">{button}</button></div>;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
